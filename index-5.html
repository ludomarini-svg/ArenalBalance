const KEY='renal-balance-v1';const today=()=>new Date().toLocaleDateString('sv-SE');const defaults={settings:{dryWeight:78.4,drinkLimit:'',potassiumLimit:'',phosphorusLimit:'',dialysisDays:'Lunedì, Mercoledì, Venerdì'},entries:[],weights:[],sessions:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};for(let k of Object.keys(defaults))if(!db[k])db[k]=structuredClone(defaults[k]);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}const num=v=>Number(v)||0;const fmt=(v,d=0)=>Number(v||0).toLocaleString('it-IT',{maximumFractionDigits:d});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2);let tab='home';const tabs=[['home','Oggi'],['food','Pasti'],['weight','Peso'],['dialysis','Dialisi'],['settings','Impostazioni']];function show(t){tab=t;render()};function sum(date,field){return db.entries.filter(x=>x.date===date).reduce((s,x)=>s+num(x[field]),0)}function latestWeight(){return [...db.weights].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id))[0]}function dayrows(){return [...db.entries].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id))}function progress(value,limit){return limit?`<div class="bar"><span style="width:${Math.min(100,100*value/limit)}%"></span></div>`:''}function metric(name,value,unit,limit){return `<div class="metric"><span class="muted">${name}</span><strong>${fmt(value)} ${unit}</strong><span class="muted">${limit?`Obiettivo impostato: ${fmt(limit)} ${unit}`:'Nessun limite impostato'}</span>${progress(value,limit)}</div>`}function field(label,name,type='number',value='',step='any'){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" ${type==='number'?'min="0" step="'+step+'"':''} value="${esc(value)}"></div>`}function render(){document.querySelector('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="show('${id}')">${label}</button>`).join('');tabs.forEach(([id])=>document.getElementById(id).classList.toggle('hidden',id!==tab));const d=today(),s=db.settings,w=latestWeight(),dr=num(s.dryWeight);document.getElementById('home').innerHTML=`<div class="card"><h2>Riepilogo di oggi · ${d.split('-').reverse().join('/')}</h2><div class="grid">${metric('Acqua totale stimata',sum(d,'water'),'ml',0)}${metric('Bevande registrate',sum(d,'drinkWater'),'ml',num(s.drinkLimit))}${metric('Potassio stimato',sum(d,'potassium'),'mg',num(s.potassiumLimit))}${metric('Fosforo stimato',sum(d,'phosphorus'),'mg',num(s.phosphorusLimit))}<div class="metric"><span class="muted">Ultimo peso</span><strong>${w?fmt(w.kg,2)+' kg':'—'}</strong><span class="muted">${w&&dr?'Differenza dal peso secco: '+fmt(w.kg-dr,2)+' kg':'Peso secco: '+fmt(dr,2)+' kg'}</span></div></div></div><div class="card"><h2>Inserimento rapido</h2><div class="actions"><button onclick="show('food')">+ Pasto / bevanda</button><button onclick="show('weight')">+ Peso</button><button onclick="show('dialysis')">+ Dialisi</button></div></div><div class="card"><h2>Ultime registrazioni</h2>${entryTable(dayrows().slice(0,8))}</div><div class="note">L'app calcola automaticamente stime di acqua, potassio e fosforo per gli alimenti presenti nell'archivio. I valori ingeriti non indicano i livelli nel sangue. In caso di dispnea o dolore toracico, richiedere assistenza medica urgente.</div>`;
document.getElementById('food').innerHTML=`<div class="card"><h2>Inserimento alimentare automatico</h2><p class="muted">Cerca un alimento, indica i grammi o i millilitri e aggiungilo. L'app calcola i nutrienti automaticamente.</p><div class="field"><label>Data</label><input type="date" id="mealDate" value="${d}"></div><div class="field"><label>Tipo di pasto</label><select id="mealKind"><option>Colazione</option><option>Pranzo</option><option>Cena</option><option>Spuntino</option><option>Bevanda</option></select></div><div class="field"><label>Cerca alimento</label><input id="foodSearch" type="search" placeholder="Es. arancia, pasta, caffè" oninput="searchFoods()" autocomplete="off"></div><div id="foodResults" class="results"></div><div class="grid"><div class="field"><label>Quantità (g o ml)</label><input id="foodQty" type="number" min="1" step="1" value="100" oninput="updatePreview()"></div><div class="field"><label>Alimento selezionato</label><input id="foodSelected" readonly placeholder="Scegli dalla ricerca"></div></div><div id="foodPreview" class="note">Seleziona un alimento per vedere i valori.</div><div class="actions" style="margin-top:12px"><button class="primary" onclick="addSelectedFood()">+ Aggiungi alimento</button><button onclick="quickAddDrink()">+ Espresso 25 ml</button></div><div id="mealDraft" style="margin-top:12px"></div><button class="primary" style="margin-top:12px;width:100%" onclick="saveMeal()">Salva pasto completo</button></div><div class="card"><h2>Storico alimentare</h2>${entryTable(dayrows())}</div><div class="note">Valori medi indicativi per alimento crudo o cotto come specificato. Prodotti, marche, sale aggiunto e cottura possono modificare molto i valori. L'acqua degli alimenti è distinta dalle bevande nel riepilogo.</div>`;if(tab==='food'){searchFoods();drawDraft()};
document.getElementById('weight').innerHTML=`<div class="card"><h2>Registra peso</h2><form onsubmit="addWeight(event)">${field('Data','date','date',d)}${field('Peso (kg)','kg','number','','0.1')}<button class="primary">Salva peso</button></form></div><div class="card"><h2>Andamento peso (ultime 10 misure)</h2>${weightChart()}</div><div class="card"><h2>Storico peso</h2><table><tr><th>Data</th><th>Peso</th><th>Δ secco</th><th></th></tr>${[...db.weights].reverse().map(x=>`<tr><td>${x.date}</td><td>${fmt(x.kg,2)} kg</td><td>${fmt(x.kg-dr,2)} kg</td><td><button class="pill danger" onclick="del('weights','${x.id}')">Elimina</button></td></tr>`).join('')}</table></div>`;
document.getElementById('dialysis').innerHTML=`<div class="card"><h2>Registra seduta dialitica</h2><form onsubmit="addSession(event)">${field('Data','date','date',d)}<div class="grid">${field('Peso prima (kg)','before','number','','0.1')}${field('Peso dopo (kg)','after','number','','0.1')}${field('Ultrafiltrazione macchina (L)','uf','number','','0.1')}${field('Durata (ore)','hours','number','4','0.25')}</div><div class="field"><label>Note</label><textarea name="notes" placeholder="Pressione, sintomi, indicazioni del centro"></textarea></div><button class="primary">Salva seduta</button></form></div><div class="card"><h2>Storico sedute</h2><table><tr><th>Data</th><th>Prima → dopo</th><th>UF</th><th></th></tr>${[...db.sessions].reverse().map(x=>`<tr><td>${x.date}<div class="mini">${esc(x.notes)}</div></td><td>${fmt(x.before,1)} → ${fmt(x.after,1)} kg</td><td>${fmt(x.uf,2)} L</td><td><button class="pill danger" onclick="del('sessions','${x.id}')">Elimina</button></td></tr>`).join('')}</table></div>`;
document.getElementById('settings').innerHTML=`<div class="card"><h2>Impostazioni personali</h2><form onsubmit="setSettings(event)">${field('Peso secco (kg)','dryWeight','number',s.dryWeight,'0.1')}${field('Limite bevande (ml/giorno, se prescritto)','drinkLimit','number',s.drinkLimit)}${field('Riferimento potassio alimentare (mg/giorno, se prescritto)','potassiumLimit','number',s.potassiumLimit)}${field('Riferimento fosforo alimentare (mg/giorno, se prescritto)','phosphorusLimit','number',s.phosphorusLimit)}${field('Giorni abituali dialisi','dialysisDays','text',s.dialysisDays)}<button class="primary">Salva impostazioni</button></form></div><div class="card"><h2>Dati e backup</h2><p class="muted">Tutti i dati sono conservati in questo browser. Cancellare i dati del sito può eliminare il diario.</p><div class="actions"><button onclick="exportData()">Esporta backup JSON</button><button onclick="exportCSV()">Esporta pasti CSV</button></div><div class="field"><label>Ripristina backup JSON</label><input type="file" accept="application/json,.json" onchange="importData(event)"></div></div><div class="note">Questa app è un diario, non un dispositivo medico. Nessuna soglia viene prescritta automaticamente. I contatori sommano soltanto i valori effettivamente compilati.</div>`}
function entryTable(rows){return rows.length?`<table><tr><th>Data / pasto</th><th>Descrizione</th><th>Acqua stimata</th><th></th></tr>${rows.map(x=>`<tr><td>${x.date}<div class="mini">${esc(x.kind)}</div></td><td>${esc(x.description)}<div class="mini muted">K ${x.potassium==null?'?':x.potassium+' mg'} · P ${x.phosphorus==null?'?':x.phosphorus+' mg'}</div></td><td>${x.water==null?'?':x.water+' ml'}</td><td><button class="pill danger" onclick="del('entries','${x.id}')">×</button></td></tr>`).join('')}</table>`:'<p class="muted">Nessuna registrazione.</p>'}function formObj(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}function optional(v){return v===''?null:num(v)}function addEntry(e){let x=formObj(e);db.entries.push({id:uid(),date:x.date,kind:x.kind,description:x.description,water:optional(x.water),potassium:optional(x.potassium),phosphorus:optional(x.phosphorus),sodium:optional(x.sodium),protein:optional(x.protein)});save()}function addWeight(e){let x=formObj(e);if(!x.kg)return;db.weights.push({id:uid(),date:x.date,kg:num(x.kg)});save()}function addSession(e){let x=formObj(e);db.sessions.push({id:uid(),date:x.date,before:optional(x.before),after:optional(x.after),uf:optional(x.uf),hours:optional(x.hours),notes:x.notes});save()}function setSettings(e){db.settings=formObj(e);save()}function del(k,id){if(confirm('Eliminare questa registrazione?')){db[k]=db[k].filter(x=>x.id!==id);save()}}function weightChart(){let a=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-10);if(!a.length)return '<p class="muted">Inserisci il primo peso per vedere il grafico.</p>';let min=Math.min(...a.map(x=>x.kg),num(db.settings.dryWeight))-1,max=Math.max(...a.map(x=>x.kg),num(db.settings.dryWeight))+1;return `<div class="chart" style="margin-bottom:32px">${a.map(x=>`<div title="${x.date}: ${x.kg} kg" style="height:${Math.max(5,(x.kg-min)/(max-min)*100)}%"><span>${x.date.slice(5)}</span></div>`).join('')}</div>`}function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('renal-balance-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let cols=['date','kind','description','water','potassium','phosphorus','sodium','protein','drinkWater'];let rows=[cols.join(';'),...db.entries.map(x=>cols.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(';'))];download('renal-balance-pasti-'+today()+'.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8')}async function importData(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.settings||!Array.isArray(x.entries)||!Array.isArray(x.weights)||!Array.isArray(x.sessions))throw Error();if(confirm('Sostituire tutti i dati con il backup selezionato?')){db=x;save()}}catch{alert('Backup non valido')}}

const DRINKS=new Set(['Acqua naturale','Acqua frizzante','Caffè espresso','Tè senza zucchero','Coca Cola','Succo arancia','Latte intero','Latte parzialmente scremato','Latte di soia non fortificato','Latte di avena non fortificato','Vino']);
function searchFoods(){let q=(document.getElementById('foodSearch')?.value||'').toLocaleLowerCase('it');let matches=FOODS.filter(f=>f.name.toLocaleLowerCase('it').includes(q)).slice(0,12);let box=document.getElementById('foodResults');if(box)box.innerHTML=matches.map(f=>`<button class="pill" onclick="chooseFood(${FOODS.indexOf(f)})">${esc(f.name)}</button>`).join('')||'<p class="muted">Alimento non presente nell’archivio.</p>'}
function chooseFood(i){selectedFood=FOODS[i];document.getElementById('foodSelected').value=selectedFood.name;document.getElementById('foodSearch').value=selectedFood.name;searchFoods();updatePreview()}
function foodCalc(f,q){let z=q/100;return {name:f.name,qty:q,water:f.water*z,potassium:f.potassium*z,phosphorus:f.phosphorus*z,sodium:f.sodium*z,protein:f.protein*z,drinkWater:DRINKS.has(f.name)?f.water*z:0}}
function updatePreview(){let e=document.getElementById('foodPreview');if(!e)return;if(!selectedFood){e.textContent='Seleziona un alimento.';return}let q=num(document.getElementById('foodQty').value),a=foodCalc(selectedFood,q);e.innerHTML=`<b>${esc(a.name)} · ${fmt(q)} ${DRINKS.has(a.name)?'ml':'g'}</b><div>Acqua ${fmt(a.water)} ml · Potassio ${fmt(a.potassium)} mg · Fosforo ${fmt(a.phosphorus)} mg · Sodio ${fmt(a.sodium)} mg · Proteine ${fmt(a.protein,1)} g</div>`}
function addSelectedFood(){if(!selectedFood){alert('Seleziona un alimento.');return}let q=num(document.getElementById('foodQty').value);if(q<=0){alert('Inserisci una quantità positiva.');return}mealDraft.push(foodCalc(selectedFood,q));drawDraft();document.getElementById('foodSearch').value='';document.getElementById('foodSelected').value='';selectedFood=null;searchFoods();updatePreview()}
function quickAddDrink(){mealDraft.push(foodCalc(FOODS.find(f=>f.name==='Caffè espresso'),25));drawDraft()}
function drawDraft(){let e=document.getElementById('mealDraft');if(!e)return;let fields=['water','potassium','phosphorus','sodium','protein','drinkWater'];let totals=Object.fromEntries(fields.map(k=>[k,mealDraft.reduce((s,x)=>s+x[k],0)]));e.innerHTML=mealDraft.length?`<h3>Alimenti del pasto</h3>${mealDraft.map((x,i)=>`<div class="draftrow">${esc(x.name)} · ${fmt(x.qty)} ${DRINKS.has(x.name)?'ml':'g'} <button class="pill danger" onclick="mealDraft.splice(${i},1);drawDraft()">×</button></div>`).join('')}<div class="note"><b>Totale:</b> acqua ${fmt(totals.water)} ml · bevande ${fmt(totals.drinkWater)} ml · K ${fmt(totals.potassium)} mg · P ${fmt(totals.phosphorus)} mg · Na ${fmt(totals.sodium)} mg · proteine ${fmt(totals.protein,1)} g</div>`:'<p class="muted">Nessun alimento aggiunto al pasto.</p>'}
function saveMeal(){if(!mealDraft.length){alert('Aggiungi almeno un alimento.');return}let date=document.getElementById('mealDate').value,kind=document.getElementById('mealKind').value;if(!date){alert('Seleziona la data.');return}let fields=['water','potassium','phosphorus','sodium','protein','drinkWater'];let totals=Object.fromEntries(fields.map(k=>[k,Math.round(mealDraft.reduce((s,x)=>s+x[k],0)*10)/10]));db.entries.push({id:uid(),date,kind,description:mealDraft.map(x=>x.name+' '+fmt(x.qty)+(DRINKS.has(x.name)?' ml':' g')).join(', '),items:mealDraft.map(x=>({...x})),...totals});mealDraft=[];save();show('food')}

render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
