<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b77"><title>Renal Balance 2.0</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18313a;background:#f3f7f7}*{box-sizing:border-box}body{margin:0}header{background:#126b77;color:white;padding:20px 18px}header h1{margin:0;font-size:24px}header small{opacity:.85}.wrap{max-width:780px;margin:auto;padding:16px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;font-weight:650;background:#dcebed;color:#14545f}button.primary{background:#126b77;color:white}nav button.active{background:#126b77;color:white}.card{background:white;border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #18313a0c}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#eef6f6;padding:14px;border-radius:13px}.metric strong{display:block;font-size:24px}.muted{color:#61767d;font-size:13px}.bar{height:9px;background:#dce7e8;border-radius:9px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:#208d99}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{margin:10px 0}label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd9da;border-radius:10px;font:inherit;background:white}textarea{min-height:70px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 5px;border-bottom:1px solid #e4eded;text-align:left}td:last-child{text-align:right} .hidden{display:none}.note{background:#fff7e8;padding:12px;border-radius:10px;font-size:13px}.danger{background:#fff0ed;color:#a33b27}.mini{font-size:12px}.chart{display:flex;align-items:end;gap:8px;height:140px;border-bottom:1px solid #ccd}.chart div{flex:1;min-width:0;background:#3194a0;border-radius:5px 5px 0 0;position:relative}.chart div span{position:absolute;bottom:-22px;font-size:10px;left:0;white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{font-size:12px;padding:7px 9px}.full{grid-column:1/-1}@media(max-width:400px){.grid{grid-template-columns:1fr 1fr}.metric strong{font-size:20px}}
</style></head><body><header><div style="max-width:780px;margin:auto"><h1>♡ Renal Balance 2.0</h1><small>Diario personale · dati sul dispositivo</small></div></header><main class="wrap"><nav id="nav"></nav><section id="home"></section><section id="food" class="hidden"></section><section id="weight" class="hidden"></section><section id="dialysis" class="hidden"></section><section id="settings" class="hidden"></section></main><script>
const FOODS=[
// Indicative values per 100 g (or 100 ml for beverages): water g, potassium mg, phosphorus mg, sodium mg, protein g.
['Mela',85.6,107,11,1,0.3],['Pera',84,116,12,1,0.4],['Arancia',86.8,181,14,0,0.9],['Mandarino',85.2,166,20,2,0.8],['Banana',74.9,358,22,1,1.1],['Uva',80.5,191,20,2,0.7],['Fragole',90.9,153,24,1,0.7],['Pesca',88.9,190,20,0,0.9],['Ananas',86,109,8,1,0.5],['Anguria',91.5,112,11,1,0.6],['Kiwi',83.1,312,34,3,1.1],['Melone',90.2,267,15,16,0.8],
['Lattuga',95,194,29,28,1.4],['Cetriolo',95.2,147,24,2,0.7],['Pomodoro',94.5,237,24,5,0.9],['Carota cruda',88.3,320,35,69,0.9],['Zucchine',94.8,261,38,8,1.2],['Melanzane',92.3,229,24,2,1],['Patate bollite',77,328,44,4,1.9],['Spinaci cotti',91,466,56,70,3],['Broccoli cotti',89,293,67,41,2.4],['Cavolfiore cotto',92,142,32,15,1.8],
['Riso bianco cotto',68.4,35,43,1,2.7],['Pasta cotta senza sale',62,44,58,1,5.8],['Pane bianco',35.6,115,97,491,8.9],['Fette biscottate',5,140,130,420,11],['Cracker non salati',3,120,140,200,9],['Fiocchi avena secchi',8,429,523,2,16.9],['Cous cous cotto',72.6,58,22,5,3.8],['Pizza margherita',44,170,170,600,11],
['Petto di pollo cotto',65,256,220,74,31],['Tacchino cotto',65,239,200,60,29],['Manzo cotto',60,318,210,65,26],['Maiale cotto',60,340,220,62,27],['Uovo intero',76,138,198,142,12.6],['Albume',87.6,163,15,166,10.9],['Salmone cotto',64,384,252,59,25],['Merluzzo cotto',78,413,203,78,23],['Tonno al naturale sgocciolato',70,237,162,247,25],['Gamberi cotti',75,264,214,111,24],
['Latte vaccino',88,150,95,44,3.4],['Yogurt bianco',85,155,95,46,3.5],['Mozzarella',50,76,350,373,22],['Parmigiano',30,92,694,1184,36],['Ricotta vaccina',74,105,154,84,11],['Burro',16,24,24,11,0.9],['Olio oliva',0,1,0,2,0],
['Espresso',98,49,3,2,0.1],['Tè preparato',99.7,8,1,3,0],['Acqua',100,0,0,0,0],['Coca-Cola',90,1,0,4,0],['Latte di soia non zuccherato',93,118,52,39,3.3],['Latte di avena',90,65,45,40,1],['Cioccolata calda con latte',80,180,120,60,4],['Gelato alla vaniglia',61,199,105,80,3.5],['Cioccolato fondente',1.4,715,308,20,7.8],['Mandorle',4.4,733,481,1,21],['Noci',4.1,441,346,2,15],['Miele',17,52,4,4,0.3]
];
const KEY='renal-balance-v1';const today=()=>new Date().toLocaleDateString('sv-SE');const defaults={settings:{dryWeight:78.4,drinkLimit:'',potassiumLimit:'',phosphorusLimit:'',dialysisDays:'Lunedì, Mercoledì, Venerdì'},entries:[],weights:[],sessions:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};for(let k of Object.keys(defaults))if(!db[k])db[k]=structuredClone(defaults[k]);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}const num=v=>Number(v)||0;const fmt=(v,d=0)=>Number(v||0).toLocaleString('it-IT',{maximumFractionDigits:d});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2);let mealItems=[];let tab='home';const tabs=[['home','Oggi'],['food','Pasti'],['weight','Peso'],['dialysis','Dialisi'],['settings','Impostazioni']];function show(t){tab=t;render()};function sum(date,field){return db.entries.filter(x=>x.date===date).reduce((s,x)=>s+num(x[field]),0)}function latestWeight(){return [...db.weights].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id))[0]}function dayrows(){return [...db.entries].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id))}function progress(value,limit){return limit?`<div class="bar"><span style="width:${Math.min(100,100*value/limit)}%"></span></div>`:''}function metric(name,value,unit,limit){return `<div class="metric"><span class="muted">${name}</span><strong>${fmt(value)} ${unit}</strong><span class="muted">${limit?`Obiettivo impostato: ${fmt(limit)} ${unit}`:'Nessun limite impostato'}</span>${progress(value,limit)}</div>`}function field(label,name,type='number',value='',step='any'){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" ${type==='number'?'min="0" step="'+step+'"':''} value="${esc(value)}"></div>`}function render(){document.querySelector('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="show('${id}')">${label}</button>`).join('');tabs.forEach(([id])=>document.getElementById(id).classList.toggle('hidden',id!==tab));const d=today(),s=db.settings,w=latestWeight(),dr=num(s.dryWeight);document.getElementById('home').innerHTML=`<div class="card"><h2>Riepilogo di oggi · ${d.split('-').reverse().join('/')}</h2><div class="grid">${metric('Liquidi registrati',sum(d,'water'),'ml',num(s.drinkLimit))}${metric('Potassio stimato',sum(d,'potassium'),'mg',num(s.potassiumLimit))}${metric('Fosforo stimato',sum(d,'phosphorus'),'mg',num(s.phosphorusLimit))}<div class="metric"><span class="muted">Ultimo peso</span><strong>${w?fmt(w.kg,2)+' kg':'—'}</strong><span class="muted">${w&&dr?'Differenza dal peso secco: '+fmt(w.kg-dr,2)+' kg':'Peso secco: '+fmt(dr,2)+' kg'}</span></div></div></div><div class="card"><h2>Inserimento rapido</h2><div class="actions"><button onclick="show('food')">+ Pasto / bevanda</button><button onclick="show('weight')">+ Peso</button><button onclick="show('dialysis')">+ Dialisi</button></div></div><div class="card"><h2>Ultime registrazioni</h2>${entryTable(dayrows().slice(0,8))}</div><div class="note">Le quantità nutrizionali sono stime calcolate dal catalogo oppure inserite manualmente. Controlla sempre porzioni, marche e preparazione. I valori ingeriti non indicano i livelli nel sangue. In caso di dispnea o dolore toracico, richiedere assistenza medica urgente.</div>`;
document.getElementById('food').innerHTML=`<div class="card"><h2>Componi un pasto · calcolo automatico</h2><p class="muted">Seleziona un alimento e indica i grammi (per le bevande, ml). I valori sono indicativi e variano per marca, ricetta e cottura.</p><div class="field"><label for="foodSearch">Cerca alimento</label><input id="foodSearch" type="search" placeholder="Es. riso, mela, espresso" oninput="filterFoods()"></div><div class="grid"><div class="field"><label for="foodChoice">Alimento</label><select id="foodChoice">${foodOptions('')}</select></div><div class="field"><label for="foodQty">Quantità (g o ml)</label><input id="foodQty" type="number" min="1" step="1" value="100"></div></div><button type="button" onclick="addFoodItem()">+ Aggiungi alimento</button><div id="mealPreview">${mealPreview()}</div><div class="field"><label for="mealDate">Data</label><input id="mealDate" type="date" value="${d}"></div><div class="field"><label for="mealKind">Pasto</label><select id="mealKind"><option>Colazione</option><option>Pranzo</option><option>Cena</option><option>Spuntino</option><option>Bevanda</option></select></div><button class="primary" type="button" onclick="saveMeal()">Salva pasto calcolato</button></div><div class="card"><h2>Inserimento manuale (facoltativo)</h2><form onsubmit="addEntry(event)">${field('Data','date','date',d)}<div class="field"><label>Tipo</label><select name="kind"><option>Colazione</option><option>Pranzo</option><option>Cena</option><option>Spuntino</option><option>Bevanda</option></select></div><div class="field"><label>Alimenti e quantità</label><textarea name="description" required placeholder="Es. 1 espresso da 25 ml, 100 g di riso, 120 g di pollo"></textarea></div><div class="grid">${field('Liquidi (ml)','water')}${field('Potassio stimato (mg)','potassium')}${field('Fosforo stimato (mg)','phosphorus')}${field('Sodio stimato (mg)','sodium')}${field('Proteine stimate (g)','protein')}</div><p class="muted">Per alimenti presenti nel catalogo, usa il calcolo automatico sopra. Compila solo i valori che conosci. Lascia vuoti quelli sconosciuti: non verranno considerati zero.</p><button class="primary" type="submit">Salva registrazione</button></form></div><div class="card"><h2>Storico alimentare</h2>${entryTable(dayrows())}</div>`;
document.getElementById('weight').innerHTML=`<div class="card"><h2>Registra peso</h2><form onsubmit="addWeight(event)">${field('Data','date','date',d)}${field('Peso (kg)','kg','number','','0.1')}<button class="primary">Salva peso</button></form></div><div class="card"><h2>Andamento peso (ultime 10 misure)</h2>${weightChart()}</div><div class="card"><h2>Storico peso</h2><table><tr><th>Data</th><th>Peso</th><th>Δ secco</th><th></th></tr>${[...db.weights].reverse().map(x=>`<tr><td>${x.date}</td><td>${fmt(x.kg,2)} kg</td><td>${fmt(x.kg-dr,2)} kg</td><td><button class="pill danger" onclick="del('weights','${x.id}')">Elimina</button></td></tr>`).join('')}</table></div>`;
document.getElementById('dialysis').innerHTML=`<div class="card"><h2>Registra seduta dialitica</h2><form onsubmit="addSession(event)">${field('Data','date','date',d)}<div class="grid">${field('Peso prima (kg)','before','number','','0.1')}${field('Peso dopo (kg)','after','number','','0.1')}${field('Ultrafiltrazione macchina (L)','uf','number','','0.1')}${field('Durata (ore)','hours','number','4','0.25')}</div><div class="field"><label>Note</label><textarea name="notes" placeholder="Pressione, sintomi, indicazioni del centro"></textarea></div><button class="primary">Salva seduta</button></form></div><div class="card"><h2>Storico sedute</h2><table><tr><th>Data</th><th>Prima → dopo</th><th>UF</th><th></th></tr>${[...db.sessions].reverse().map(x=>`<tr><td>${x.date}<div class="mini">${esc(x.notes)}</div></td><td>${fmt(x.before,1)} → ${fmt(x.after,1)} kg</td><td>${fmt(x.uf,2)} L</td><td><button class="pill danger" onclick="del('sessions','${x.id}')">Elimina</button></td></tr>`).join('')}</table></div>`;
document.getElementById('settings').innerHTML=`<div class="card"><h2>Impostazioni personali</h2><form onsubmit="setSettings(event)">${field('Peso secco (kg)','dryWeight','number',s.dryWeight,'0.1')}${field('Limite bevande (ml/giorno, se prescritto)','drinkLimit','number',s.drinkLimit)}${field('Riferimento potassio alimentare (mg/giorno, se prescritto)','potassiumLimit','number',s.potassiumLimit)}${field('Riferimento fosforo alimentare (mg/giorno, se prescritto)','phosphorusLimit','number',s.phosphorusLimit)}${field('Giorni abituali dialisi','dialysisDays','text',s.dialysisDays)}<button class="primary">Salva impostazioni</button></form></div><div class="card"><h2>Dati e backup</h2><p class="muted">Tutti i dati sono conservati in questo browser. Cancellare i dati del sito può eliminare il diario.</p><div class="actions"><button onclick="exportData()">Esporta backup JSON</button><button onclick="exportCSV()">Esporta pasti CSV</button></div><div class="field"><label>Ripristina backup JSON</label><input type="file" accept="application/json,.json" onchange="importData(event)"></div></div><div class="note">Questa app è un diario, non un dispositivo medico. Nessuna soglia viene prescritta automaticamente. I contatori sommano i valori inseriti o stimati dal catalogo; non sono valori ematici.</div>`}
function foodOptions(search){let q=search.toLocaleLowerCase('it').trim();return FOODS.map((f,i)=>({f,i})).filter(x=>x.f[0].toLocaleLowerCase('it').includes(q)).map(x=>`<option value="${x.i}">${esc(x.f[0])}</option>`).join('')}
function filterFoods(){let sel=document.getElementById('foodChoice');sel.innerHTML=foodOptions(document.getElementById('foodSearch').value)}
function addFoodItem(){let i=Number(document.getElementById('foodChoice').value),q=Number(document.getElementById('foodQty').value);if(!FOODS[i]||!Number.isFinite(q)||q<=0||q>10000){alert('Seleziona un alimento e una quantità valida.');return}mealItems.push({i,q});document.getElementById('mealPreview').innerHTML=mealPreview()}
function mealTotals(){return mealItems.reduce((a,x)=>{let f=FOODS[x.i];for(let j=0;j<5;j++)a[j]+=f[j+1]*x.q/100;return a},[0,0,0,0,0])}
function mealPreview(){if(!mealItems.length)return '<p class="muted">Nessun alimento aggiunto.</p>';let a=mealTotals();return `<table><tr><th>Alimento</th><th>Quantità</th><th></th></tr>${mealItems.map((x,j)=>`<tr><td>${esc(FOODS[x.i][0])}</td><td>${fmt(x.q)} ${FOODS[x.i][0].match(/^(Espresso|Tè preparato|Acqua|Coca-Cola|Latte |Cioccolata calda)/)?'ml':'g'}</td><td><button class="pill danger" onclick="removeFood(${j})">×</button></td></tr>`).join('')}</table><p class="muted">Acqua negli alimenti e bevande: <b>${fmt(a[0])} ml</b> · Potassio: <b>${fmt(a[1])} mg</b> · Fosforo: <b>${fmt(a[2])} mg</b> · Sodio: ${fmt(a[3])} mg · Proteine: ${fmt(a[4],1)} g</p>`}
function removeFood(j){mealItems.splice(j,1);document.getElementById('mealPreview').innerHTML=mealPreview()}
function saveMeal(){if(!mealItems.length){alert('Aggiungi almeno un alimento.');return}let a=mealTotals(),date=document.getElementById('mealDate').value,kind=document.getElementById('mealKind').value;if(!date){alert('Inserisci una data.');return}let description=mealItems.map(x=>`${FOODS[x.i][0]} ${x.q} ${FOODS[x.i][0].match(/^(Espresso|Tè preparato|Acqua|Coca-Cola|Latte |Cioccolata calda)/)?'ml':'g'}`).join(', ');db.entries.push({id:uid(),date,kind,description,water:Math.round(a[0]),potassium:Math.round(a[1]),phosphorus:Math.round(a[2]),sodium:Math.round(a[3]),protein:Math.round(a[4]*10)/10,estimated:true});mealItems=[];save();show('food')}
function entryTable(rows){return rows.length?`<table><tr><th>Data / pasto</th><th>Descrizione</th><th>Liquidi</th><th></th></tr>${rows.map(x=>`<tr><td>${x.date}<div class="mini">${esc(x.kind)}</div></td><td>${esc(x.description)}<div class="mini muted">K ${x.potassium==null?'?':x.potassium+' mg'} · P ${x.phosphorus==null?'?':x.phosphorus+' mg'}</div></td><td>${x.water==null?'?':x.water+' ml'}</td><td><button class="pill danger" onclick="del('entries','${x.id}')">×</button></td></tr>`).join('')}</table>`:'<p class="muted">Nessuna registrazione.</p>'}function formObj(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}function optional(v){return v===''?null:num(v)}function addEntry(e){let x=formObj(e);db.entries.push({id:uid(),date:x.date,kind:x.kind,description:x.description,water:optional(x.water),potassium:optional(x.potassium),phosphorus:optional(x.phosphorus),sodium:optional(x.sodium),protein:optional(x.protein)});save()}function addWeight(e){let x=formObj(e);if(!x.kg)return;db.weights.push({id:uid(),date:x.date,kg:num(x.kg)});save()}function addSession(e){let x=formObj(e);db.sessions.push({id:uid(),date:x.date,before:optional(x.before),after:optional(x.after),uf:optional(x.uf),hours:optional(x.hours),notes:x.notes});save()}function setSettings(e){db.settings=formObj(e);save()}function del(k,id){if(confirm('Eliminare questa registrazione?')){db[k]=db[k].filter(x=>x.id!==id);save()}}function weightChart(){let a=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-10);if(!a.length)return '<p class="muted">Inserisci il primo peso per vedere il grafico.</p>';let min=Math.min(...a.map(x=>x.kg),num(db.settings.dryWeight))-1,max=Math.max(...a.map(x=>x.kg),num(db.settings.dryWeight))+1;return `<div class="chart" style="margin-bottom:32px">${a.map(x=>`<div title="${x.date}: ${x.kg} kg" style="height:${Math.max(5,(x.kg-min)/(max-min)*100)}%"><span>${x.date.slice(5)}</span></div>`).join('')}</div>`}function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('renal-balance-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let cols=['date','kind','description','water','potassium','phosphorus','sodium','protein'];let rows=[cols.join(';'),...db.entries.map(x=>cols.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(';'))];download('renal-balance-pasti-'+today()+'.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8')}async function importData(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.settings||!Array.isArray(x.entries)||!Array.isArray(x.weights)||!Array.isArray(x.sessions))throw Error();if(confirm('Sostituire tutti i dati con il backup selezionato?')){db=x;save()}}catch{alert('Backup non valido')}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
